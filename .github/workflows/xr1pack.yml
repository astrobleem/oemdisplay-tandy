          if grep -Fxq -- "$tag" existing-tags.txt; then
            echo 'Release already exists; refusing replacement.' >&2
            exit 1
          fi
          printf '%s\n' \
            'Current XR1 installer package: supply matching Windows 3.0 media; all required project runtime components are included.' \
