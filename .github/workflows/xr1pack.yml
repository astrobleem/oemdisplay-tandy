          for name, pin in pins.items():
              data = (p/name).read_bytes()
              assert {'bytes': len(data), 'sha256': digest(data)} == pin, name
          assert (p/'RELEASE.JSON').stat().st_size < 131072
          r = json.loads((p/'RELEASE.JSON').read_bytes())
          sha = os.environ['SOURCE_SHA']
          assert re.fullmatch('[0-9a-f]{40}', sha)
          expected_release['commit'] = sha
          assert r == expected_release
          q = json.loads((p/'QUALIFY.JSON').read_bytes())
          assert q['status'] == 'PASS_HOST_AND_NATIVE' and q['physical_qualification'] is False
