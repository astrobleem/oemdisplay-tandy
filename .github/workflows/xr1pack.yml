name: Verify current XR1 installer package

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v0.1.0-rc.8']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xr1-package-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact public event commit without credentials
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git sparse-checkout init --no-cone
          printf '/tools/XR1PACK/\n/docs/RELEASES/RC8.MD\n/.github/\n/.gitattributes\n/AGENTS.md\n' | git sparse-checkout set --no-cone --stdin
          git checkout --detach --force FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Check preparation boundaries and closed release inventory
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 tools/XR1PACK/TESTPREP.PY
          python3 tools/XR1PACK/TESTPUB.PY
          python3 tools/XR1PACK/PUBLISH.PY --out release-xr1 --commit "$SOURCE_SHA"
          python3 tools/XR1PACK/PUBLISH.PY --verify release-xr1 --commit "$SOURCE_SHA"
          cd release-xr1
          tr -d '\r' < SHA256SUMS | sha256sum --check -

      - name: Upload verified current package from this exact commit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: winxt-xr1-${{ github.sha }}
          path: release-xr1/*
          if-no-files-found: error
          retention-days: 30

  draft-release:
    needs: verify
    if: >-
      github.repository == 'astrobleem/oemdisplay-tandy' &&
      github.event_name == 'push' && github.ref == 'refs/tags/v0.1.0-rc.8'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: winxt-draft-v0.1.0-rc.8
      cancel-in-progress: false
    steps:
      # This runner never checks out or executes repository/artifact code.
      - name: Download only this run's verified artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: winxt-xr1-${{ github.sha }}
          path: release-xr1

      - name: Recheck fixed archive identities and qualification
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, zipfile
          from pathlib import Path
          p = Path('release-xr1')
          pins = {'QUALIFY.JSON': {'bytes': 12679,
                            'sha256': 'bda3ae0713b49667c3b9e85be9fb462df83242ff6f6394b7df0bf013ded490d2'},
           'START-HERE.TXT': {'bytes': 3926,
                              'sha256': '9701510132b7ddef84223f7fb9aea3836f0610c4d05537f66a473276c5ef20f2'},
           'WINMINE30.ZIP': {'bytes': 37810,
