name: ColorPlus and Yamaha Output qualification

on:
  pull_request:
    paths:
      - 'src/pcp/**'
      - 'src/rrect/**'
      - 'src/tandysw/**'
      - 'tools/BUILDDEPS/LOCK.JSON'
      - 'tools/APPSET/**'
      - 'tools/YAMPACK/**'
      - 'docs/yamaha/**'
      - 'downloads/experimental/yamaha/**'
      - 'experiments/DGSCOPY/**'
      - 'tools/XR1PACK/PREPARE.PY'
      - 'tools/XR1PACK/OWATCOM.TXT'
      - 'distributions/WINXT/**'
      - 'downloads/experimental/CPPAN/**'
      - 'tools/CPPACK/**'
      - 'tools/SPPACK/**'
      - 'tools/PANUI/**'
      - 'src/panui/**'
      - 'src/softpan/PACKCP.PY'
      - 'tools/CURRENT/PRODUCTS.JSN'
      - 'tools/CURRENT/GUIDES/CPPAN.TXT'
      - 'tools/CURRENT/BUNDLE.PY'
      - 'tools/DRVSET/**'
      - 'docs/pcp/OUTPUT/**'
      - '.github/workflows/colorplus.yml'
  push:
    branches: [main, feat/colorplus-output]
    paths:
      - 'src/pcp/**'
      - 'src/rrect/**'
      - 'src/tandysw/**'
      - 'tools/BUILDDEPS/LOCK.JSON'
      - 'tools/APPSET/**'
      - 'tools/YAMPACK/**'
      - 'docs/yamaha/**'
      - 'downloads/experimental/yamaha/**'
      - 'experiments/DGSCOPY/**'
      - 'tools/XR1PACK/PREPARE.PY'
      - 'tools/XR1PACK/OWATCOM.TXT'
      - 'distributions/WINXT/**'
      - 'downloads/experimental/CPPAN/**'
      - 'tools/CPPACK/**'
      - 'tools/SPPACK/**'
      - 'tools/PANUI/**'
      - 'src/panui/**'
      - 'src/softpan/PACKCP.PY'
      - 'tools/CURRENT/PRODUCTS.JSN'
      - 'tools/CURRENT/GUIDES/CPPAN.TXT'
      - 'tools/CURRENT/BUNDLE.PY'
      - 'tools/DRVSET/**'
      - 'docs/pcp/OUTPUT/**'
      - '.github/workflows/colorplus.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Confirm exact reviewed head
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: ColorPlus source and planar models
        run: |
          python3 -B src/pcp/PCPPATCH.PY --check
          python3 -B src/pcp/CPPOTEST.PY
          python3 -B src/pcp/CPCTEST.PY
      - name: Replay saved native captures and exact packet bindings
        run: |
          python3 -B src/pcp/CPVERIFY.PY
          python3 -B tools/DRVSET/VERIFY.PY
          python3 -B tools/CPPACK/TESTSCP.PY
          python3 -B tools/CPPACK/TESTPUB.PY
          python3 -B tools/CPPACK/TESTCUR.PY
          python3 -B tools/CPPACK/TESTPKG.PY
          python3 -B experiments/DGSCOPY/TESTVFY.PY
          python3 -B experiments/DGSCOPY/TEST.PY --out "$RUNNER_TEMP/copy-span"
          python3 -B tools/YAMPACK/TEST.PY
          python3 - <<'PYCODE'
          import importlib.machinery,json
          from pathlib import Path
          spec=json.loads(Path('tools/CURRENT/PRODUCTS.JSN').read_bytes())
          gate=importlib.machinery.SourceFileLoader('exact_yamaha','tools/YAMPACK/PACK.PY').load_module()
          for profile,name in [('pc1','PC1.ZIP'),('b800','YAMAHA.ZIP')]:
              row=spec['local'][name];data=Path(row['source']).read_bytes()
              if gate.identity(data)!=row['identity']:raise ValueError('Catalog source identity differs: '+name)
              gate.verify(profile,data)
          PYCODE

  publication-check:
    needs: exact-source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      drivers_changed: ${{ steps.scope.outputs.changed }}
      driver_only: ${{ steps.scope.outputs.driver_only }}
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Build from existing native-qualified core and pinned catalog inputs
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,urllib.request
          from pathlib import Path
          spec=json.loads(Path('tools/CURRENT/PRODUCTS.JSN').read_bytes())
          Path('sound-inputs').mkdir()
          for name,row in spec['sound'].items():
              data=urllib.request.urlopen(row['source'],timeout=60).read()
              assert {'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}==row['identity'],name
              (Path('sound-inputs')/name).write_bytes(data)
          PYCODE
          CORE_SHA=$(python3 -c "import json; print(json.load(open('tools/CURRENT/PRODUCTS.JSN'))['core_source_commit'])")
          python3 -B tools/HPDIB/PUBLISH.PY --out core --commit "$CORE_SHA"
          python3 -B tools/CURRENT/CHECK.PY --core core --sound sound-inputs --report catalog-check.json
          python3 -B tools/CURRENT/BUNDLE.PY --core core --sound sound-inputs --commit "$SOURCE_SHA" --out current
      - name: Determine whether this catalog changes either fixed-driver packet
        id: scope
        run: |
          python3 - <<'PYCODE'
          import importlib.machinery,json,os
          from pathlib import Path
          publisher=importlib.machinery.SourceFileLoader('scope','tools/CPPACK/CPPUB.PY').load_module()
          release=json.loads(publisher.download('https://api.github.com/repos/'+publisher.REPOSITORY+'/releases/tags/windows-xt'))
          changed,driver_only=publisher.scope(Path('current'),release)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('changed='+str(changed).lower()+'\n')
              out.write('driver_only='+str(driver_only).lower()+'\n')
          print('Fixed-driver packets or catalog bindings changed:',changed)
          print('Within ColorPlus/Yamaha fixed-driver-only publisher scope:',driver_only)
          if not driver_only:raise ValueError('Shared helper/support changes are outside this publisher scope')
          PYCODE
      - name: Check both exact driver candidates against current release without writes
        if: steps.scope.outputs.changed == 'true' && steps.scope.outputs.driver_only == 'true'
        run: |
          python3 -B tools/CPPACK/CPPUB.PY --folder current --commit "$SOURCE_SHA" --prepare
          python3 -B tools/CPPACK/CPPUB.PY --folder current --commit "$SOURCE_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: colorplus-current-${{ env.SOURCE_SHA }}
          path: current/*
          if-no-files-found: error

  publish-drivers:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.publication-check.outputs.drivers_changed == 'true' && needs.publication-check.outputs.driver_only == 'true'
    needs: publication-check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    concurrency:
      group: current-colorplus-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read back this run's verified catalog artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" --name "colorplus-current-${{ github.sha }}" --dir current
      - name: Publish only qualified ColorPlus/Yamaha ZIPs and catalog records, then read back
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/CPPACK/CPPUB.PY --folder current --commit "${{ github.sha }}" --publish
