name: Graphics System fonts
on:
  pull_request:
    paths: ['tools/SYSFONT/**', 'tools/FONTPACK/PREPARE.PY', 'tools/FONTPACK/TESTSRC.PY', 'downloads/SYSFONT/**', 'docs/SYSFONT.MD', '.github/workflows/system-fonts.yml']
  push:
    branches: [main]
    paths: ['tools/SYSFONT/**', 'tools/FONTPACK/PREPARE.PY', 'tools/FONTPACK/TESTSRC.PY', 'downloads/SYSFONT/**', 'docs/SYSFONT.MD', '.github/workflows/system-fonts.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: |
          python3 -B tools/SYSFONT/CHECK.PY
          python3 -B tools/FONTPACK/TESTSRC.PY
          python3 -B tools/SYSFONT/PACK.PY --out packages
          python3 -B tools/SYSFONT/PACK.PY --verify packages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: graphics-system-fonts-${{ github.event.pull_request.head.sha || github.sha }}
          path: packages/*.ZIP
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    concurrency:
      group: current-system-font-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Read back this run's verified font archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" --name "graphics-system-fonts-${{ github.sha }}" --dir packages
      - name: Publish only the qualified CGA and Tandy System-font archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/SYSFONT/PACK.PY --publish packages --commit "${{ github.sha }}"
