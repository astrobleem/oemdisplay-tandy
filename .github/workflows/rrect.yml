name: Verify RoundRect investigation host checks

on:
  pull_request:
    paths:
      - 'src/rrect/**'
      - 'experiments/XYRRECT/**'
      - 'tools/XRSYNC/**'
      - 'docs/rrect/**'
      - 'docs/rrbatch/**'
      - 'docs/rrsync/**'
      - 'docs/TRIAL5/BUILDS.JSN'
      - '.github/workflows/rrect.yml'
  push:
    branches: [main]
    paths:
      - 'src/rrect/**'
      - 'experiments/XYRRECT/**'
      - 'tools/XRSYNC/**'
      - 'docs/rrect/**'
      - 'docs/rrbatch/**'
      - 'docs/rrsync/**'
      - 'docs/TRIAL5/BUILDS.JSN'
      - '.github/workflows/rrect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out exact public source without credentials
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git sparse-checkout init --no-cone
          printf '/src/rrect/\n/experiments/XYRRECT/\n/tools/XRSYNC/\n/tools/XR1PACK/\n/docs/rrect/\n/docs/rrbatch/\n/docs/rrsync/\n/docs/TRIAL5/BUILDS.JSN\n' | git sparse-checkout set --no-cone --stdin
          git checkout --detach --force FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Verify exact frame checker, patch anchors and recorded A/B evidence
        run: python3 -B src/rrect/RRTEST.PY
      - name: Verify exact installable driver kit and own-media preparation
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 -B tools/XRSYNC/TESTPKG.PY
          python3 -B tools/XRSYNC/PUBLISH.PY --out release-sync --commit "$SOURCE_SHA"
          python3 -B tools/XRSYNC/PUBLISH.PY --out release-sync --commit "$SOURCE_SHA"
      - name: Upload verified XRSYNC package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xrsync-${{ github.sha }}
          path: release-sync/*
          if-no-files-found: error
          retention-days: 30
