name: Native app packet closure
on:
  pull_request:
    paths:
      - 'tools/APPSET/**'
      - 'tools/MINEAPP/**'
      - 'examples/COOKIE/INSTALL.TXT'
      - '.github/workflows/app-packets.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packet:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out exact public source without credentials
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git sparse-checkout init --no-cone
          printf '/.gitattributes\n/tools/APPSET/\n/tools/MINEAPP/\n/examples/COOKIE/INSTALL.TXT\n' | git sparse-checkout set --no-cone --stdin
          git checkout --detach --force FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - run: python3 -B tools/APPSET/TESTPKG.PY
