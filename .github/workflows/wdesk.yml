name: Window workspace
on:
  pull_request:
    paths:
      - 'src/wdesk/**'
      - 'src/panui/**'
      - 'src/xtpan/**'
      - 'experiments/XYOVERVIEW/XYCTL.C'
      - '.github/workflows/wdesk.yml'
  push:
    branches: [main]
    paths:
      - 'src/wdesk/**'
      - 'src/panui/**'
      - '.github/workflows/wdesk.yml'
permissions:
  contents: read
jobs:
  wdesk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Core checks and three negative controls
        run: python3 src/wdesk/BUILD.PY --skip-win16 --out "$RUNNER_TEMP/wdesk-core"
      - name: Actual adapter and placement source
        run: |
          python3 src/wdesk/ADAPTER.PY --out "$RUNNER_TEMP/wdesk-adapter"
          python3 src/wdesk/PLACE/TESTS/RUN.PY --out "$RUNNER_TEMP/placement"
      - name: Settings policy and exact package evidence
        run: |
          python3 src/panui/HOSTUI.PY
          python3 tools/PANUI/TEST.PY
