name: Build Windows XT disks

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing vMAJOR.MINOR.PATCH[-prerelease] tag at this exact commit; blank builds artifacts only'
        required: false
        default: ''
        type: string

# Builds and PRs stay read-only; only the gated draft job can write releases.
permissions:
  contents: read

concurrency:
  group: winxt-disks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Anonymous Git preserves the exact public event-SHA checkout;
      # exact event-SHA checkout still tests GitHub's PR merge commit.
      - name: Check out exact public source without credentials
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git sparse-checkout init --no-cone
          printf '/examples/TSHELL/\n/tools/FLASHDISK/\n/tools/BUILDDEPS/\n/distributions/WINXT/\n/examples/WXTSPL/WAVE/\n/examples/WXTSPL/WXTSPL01.RLE\n/examples/WXTSPL/ART/assets/WXTSPL01.RLE\n/src/tandysw/TINST.C\n/examples/WXTSPL/UPDATER/\n/docs/QUAL/WAVEINS.JSON\n/docs/QUAL/CPSET.JSON\n/tools/CPSET/\n/docs/PROMO/VERIFY.PY\n/docs/PROMO/PBRUSH16.JSON\n/docs/PROMO/SHOWCASE.MD\n/README.md\n/tools/XTMODE/\n/tools/XTLOGO/\n/tools/XTFONTS/\n/docs/FONTS/\n/docs/QUAL/\n/.github/\n/.gitattributes\n/AGENTS.md\n/BUILDING.MD\n/docs/USERMAN.MD\n' | git sparse-checkout set --no-cone --stdin
          git checkout --detach --force FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up pinned host font renderer
        run: |
          python3 -m venv "$RUNNER_TEMP/xt-pixels-python"
          "$RUNNER_TEMP/xt-pixels-python/bin/python" -m pip install --disable-pip-version-check Pillow==12.0.0
          echo "$RUNNER_TEMP/xt-pixels-python/bin" >> "$GITHUB_PATH"

      - name: Test FAT12 format and release packaging
        run: |
          python3 tools/BUILDDEPS/TESTDEPS.PY
          python3 examples/TSHELL/TESTS/BNDTEST.PY
          python3 examples/TSHELL/TESTS/GRPTEST.PY
          python3 examples/TSHELL/TESTS/RUNHOST.PY
          python3 examples/TSHELL/DOS/TESTSEL.PY
          python3 examples/TSHELL/DOS/TESTNITE.PY
          python3 docs/PROMO/VERIFY.PY
          python3 tools/FLASHDISK/TESTFAT.PY
          python3 tools/FLASHDISK/TESTWAVE.PY
          python3 tools/FLASHDISK/TESTPKG.PY

      - name: Verify original font reproduction and saved native glyph evidence
        run: |
          python3 tools/XTFONTS/HOST.PY BUILD.PY --out font-build
          python3 tools/XTFONTS/HOST.PY TEST.PY --out font-build
          # Validators emit derived PNG/JSON files; keep pinned evidence pristine.
          cp -a docs/FONTS "$RUNNER_TEMP/native-font-checks"
          python3 tools/XTFONTS/HOST.PY NATIVEQA.PY --native "$RUNNER_TEMP/native-font-checks/FIVE-MODES" --fonts font-build
          python3 tools/XTFONTS/HOST.PY ENCQA.PY --guest "$RUNNER_TEMP/native-font-checks/ALL-BYTES/CGA" --fonts font-build --family CGA
          python3 tools/XTFONTS/HOST.PY ENCQA.PY --guest "$RUNNER_TEMP/native-font-checks/ALL-BYTES/EGA" --fonts font-build --family EGA
          python3 tools/XTFONTS/HOST.PY ENCQA.PY --guest "$RUNNER_TEMP/native-font-checks/ALL-BYTES/TXFONT" --fonts font-build --family TXT

      - name: Build public 720 KB disk and portable ZIP
        run: python3 tools/FLASHDISK/MAKEIMG.PY --out dist

      - name: Verify public output and checksums
        run: |
          python3 tools/FLASHDISK/TESTWAVE.PY
          python3 tools/FLASHDISK/TESTPKG.PY --verify dist
          cd dist
          sha256sum --check SHA256SUMS

      - name: Build and verify rc.6 source, native evidence and documentation binding
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 tools/FLASHDISK/PUBLISH.PY --package dist --out release --commit "$SOURCE_SHA"
          python3 tools/FLASHDISK/PUBLISH.PY --verify release --commit "$SOURCE_SHA"
          python3 tools/FLASHDISK/TESTPUB.PY --release release
          cd release
          sha256sum --check SHA256SUMS

      - name: Upload verified public download artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: winxt-720k-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  draft-release:
    needs: build
    # Never run for PRs (including same-repository PRs) or ordinary main pushes.
    if: >-
      github.repository == 'astrobleem/oemdisplay-tandy' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: winxt-draft-${{ inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      # This fresh runner never checks out or executes repository/artifact code.
      - name: Download this run's verified public package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: winxt-720k-${{ github.sha }}
          path: dist

      - name: Recheck asset allowlist, geometry, publication flag and hashes
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          out = Path('dist')
          names = {'WINXT720.IMG','WINXT720.ZIP','WXTTOOLS.ZIP','README.TXT','BUILD.JSON',
              'PKGSUMS.TXT','WINXT-RC6-SOURCE.zip','WINXT-RC6-FONTS.zip',
              'WINXT-RC6-PREVIEWS.zip','FONT-LICENSE.TXT','START-HERE.TXT',
              'QUALIFY.JSON','RELEASE.JSON','SHA256SUMS'}
          assert {p.name for p in out.iterdir()} == names
          assert all(p.is_file() and not p.is_symlink() for p in out.iterdir())
          q = json.loads((out/'QUALIFY.JSON').read_bytes())
          r = json.loads((out/'RELEASE.JSON').read_bytes())
          snapshot = json.loads((out/'BUILD.JSON').read_bytes())
          assert q['publication_allowed'] is True and q['required_final_gates_pass'] is True
          assert q['native_implementation_qualified'] is True and q['documentation_pin_refresh_verified'] is True
          assert q['refreshed_binary_rerun_in_guest'] is False and q['hardware_qualified'] is False
          assert r['publication_allowed'] is True and r['native_code_identity_preserved'] is True
          assert r['document_pin_data_refreshed'] is True and r['refreshed_helper_executed_in_guest'] is False
          assert r['Windows_support_included'] is False
          assert q['publication_commit'] == r['publication_commit'] == os.environ['SOURCE_SHA']
          assert q['release_tag'] == r['release_tag'] == os.environ['RELEASE_TAG']
          assert snapshot['publication_allowed'] is False and snapshot['native_package_qualified'] is False
          assert snapshot['windows_support_included'] is False and snapshot['kind'] == 'dos-mode-switcher-test-candidate'
          assert snapshot['image_bytes'] == (out/'WINXT720.IMG').stat().st_size == 737280
          assert hashlib.sha256((out/'WINXT720.IMG').read_bytes()).hexdigest() == q['disk_sha256']
          assert q['zero_SHA_scope']['default_sha_blocks'] == [0,0]
          assert q['zero_SHA_scope']['default_output_readback_bytes'] == 0
          assert q['zero_SHA_scope']['explicit_VERIFY_pass'] is True
          assert q['release_tag'] == 'v0.1.0-rc.6'
          assert snapshot['native_implementation_qualified'] is True
          assert snapshot['documentation_pin_refresh_verified'] is True
          assert snapshot['refreshed_binary_rerun_in_guest'] is False
          for n,h in q['package_sha256'].items():
              assert n in {'WINXT720.IMG','WINXT720.ZIP','WXTTOOLS.ZIP','BUILD.JSON','README.TXT','SHA256SUMS'}
              name = 'PKGSUMS.TXT' if n == 'SHA256SUMS' else n
              assert hashlib.sha256((out/name).read_bytes()).hexdigest() == h
          assert set(r['assets_sha256']) == names - {'RELEASE.JSON','SHA256SUMS'}
          for n,h in r['assets_sha256'].items():
              assert hashlib.sha256((out/n).read_bytes()).hexdigest() == h
          expected = ''.join(hashlib.sha256((out/n).read_bytes()).hexdigest()+'  '+n+'\n'
              for n in sorted(names-{'SHA256SUMS'}))
          assert (out/'SHA256SUMS').read_text() == expected
          PY

      - name: Create a new draft only for an unchanged existing version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          # Require a real existing tag; resolve annotated/lightweight tags alike.
          gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > /dev/null
          tag_sha=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          test "$tag_sha" = "$SOURCE_SHA"
          # Include drafts in the lookup. API/network failure stops the job.
          existing=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | .tag_name')
          if printf '%s\n' "$existing" | grep -Fxq -- "$RELEASE_TAG"; then
            echo 'Release already exists; refusing to update or overwrite it.' >&2
            exit 1
          fi
          printf '%s\n' \
            "Verified public 720 KB Windows XT package from commit $SOURCE_SHA." \
            "Build: https://github.com/$GH_REPO/actions/runs/${{ github.run_id }}" \
            'Packages accepted pinned binaries; no legacy toolchain recompilation.' \
            'Original MIT fonts, static logo and DOS mode menu; no Windows support/toolchain included.' \
            'Use owned Windows 3.0, WIN.CNF and CGA.GR2; no vintage Python/font media needed.' \
            'Measured native implementation; reproducible host-only documentation pin refresh.' \
            'Refreshed helper was not rerun in a guest. Experimental; physical hardware remains separate.' \
            > release-notes.txt
          gh release create "$RELEASE_TAG" --repo "$GH_REPO" \
            --verify-tag --draft --latest=false \
            --title "Windows XT $RELEASE_TAG" --notes-file release-notes.txt \
            dist/WINXT720.IMG dist/WINXT720.ZIP dist/WXTTOOLS.ZIP \
            dist/README.TXT dist/BUILD.JSON dist/PKGSUMS.TXT \
            dist/WINXT-RC6-SOURCE.zip dist/WINXT-RC6-FONTS.zip \
            dist/WINXT-RC6-PREVIEWS.zip dist/FONT-LICENSE.TXT \
            dist/START-HERE.TXT dist/QUALIFY.JSON dist/RELEASE.JSON dist/SHA256SUMS
