name: Root packaging layout
on:
  pull_request:
    paths:
      - 'oemdisk/**'
      - 'CGA.*'
      - 'MAKEDISK.*'
      - 'STAGE.PY'
      - 'TANDY88.ZIP'
      - 'TNDY16.ZIP'
      - '.github/workflows/root-layout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check relocated historical producer and current packets
        run: |
          python3 -B oemdisk/TESTDISK.PY
          python3 -B src/tga2/T2PTEST.PY
          python3 -B tools/YAMPACK/TEST.PY
          python3 -B tools/XRSYNC/TESTPKG.PY
          python3 -B tools/DOSINST/TESTPUB.PY
          python3 -B tools/DRVSET/VERIFY.PY
