name: Verify Windows XT R1 release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v0.1.0-rc.7']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winxt-r1-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact public event commit without credentials
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git sparse-checkout init --no-cone
          printf '/tools/WINR1/\n/downloads/R1/\n/docs/RELEASES/RC7.MD\n/.github/\n/.gitattributes\n/AGENTS.md\n/README.md\n' | git sparse-checkout set --no-cone --stdin
          git checkout --detach --force FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Check decoder, source identity and publication guards
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 tools/WINR1/KIT/mouse/test_vectors.py
          python3 tools/WINR1/PUBLISH.PY --out release-r1 --commit "$SOURCE_SHA"
          python3 tools/WINR1/PUBLISH.PY --verify release-r1 --commit "$SOURCE_SHA"
          python3 tools/WINR1/TESTPUB.PY --release release-r1
          cd release-r1
          sha256sum --check SHA256SUMS

      - name: Upload verified R1 assets from this exact commit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: winxt-r1-${{ github.sha }}
          path: release-r1/*
          if-no-files-found: error
          retention-days: 30

  draft-release:
    needs: verify
    if: >-
      github.repository == 'astrobleem/oemdisplay-tandy' &&
      github.event_name == 'push' && github.ref == 'refs/tags/v0.1.0-rc.7'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: winxt-draft-v0.1.0-rc.7
      cancel-in-progress: false
    steps:
      # This runner never checks out or executes repository/artifact code.
      - name: Download only this run's verified artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: winxt-r1-${{ github.sha }}
          path: release-r1

      - name: Recheck exact allowlist, hashes and publication scope
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          p = Path('release-r1')
          pins = {
              'WINXT-REDISTRIBUTABLE-OVERLAY-R1.zip': (49235, '53b9cd81d49825ad21d91490d8e741e8b5715f4f99b57368e43a34ad1dd260ed'),
              'WINXT-FIRST-PARTY-R1.zip': (65989, '1631e02735289b8f7f897a9c3d53d796db8411017437950d0d8e48f9f3eeae5b'),
          }
          names = set(pins) | {'START-HERE.TXT','QUALIFY.JSON','RELEASE.JSON','SHA256SUMS'}
          assert {x.name for x in p.iterdir()} == names
          assert all(x.is_file() and not x.is_symlink() for x in p.iterdir())
          digest = lambda b: hashlib.sha256(b).hexdigest()
          for name, (length, sha) in pins.items():
              assert (p/name).stat().st_size == length
              assert digest((p/name).read_bytes()) == sha
              with zipfile.ZipFile(p/name) as z:
                  assert z.testzip() is None and len(z.namelist()) == len(set(z.namelist()))
          q = json.loads((p/'QUALIFY.JSON').read_bytes())
          r = json.loads((p/'RELEASE.JSON').read_bytes())
          assert q['publication_commit'] == r['publication_commit'] == os.environ['SOURCE_SHA']
          assert q['release_tag'] == r['release_tag'] == 'v0.1.0-rc.7'
          assert q['publication_allowed'] is True and r['publication_allowed'] is True
          assert q['standalone_installer'] is False and r['standalone_installer'] is False
          assert q['Microsoft_media_included'] is False and r['Windows_support_included'] is False
          assert q['private_project_executables_included'] is False
          assert r['unresolved_private_executables_included'] is False
          assert q['final_R1_and_new_WHEEL_physical_hardware_tested'] is False
          assert q['separately_supplied_local_files'] == 370 and q['assembled_file_count'] == 379
          assert q['native_record']['integration']['run_id'] == '59e08544551f42a18848856e5761cc61'
          assert q['native_record']['driver_sha256'] == '84df334cfc34af2dc8785676e92cfe428e0288cb21e2c6e94dbc16baba6d12f0'
          assert q['release_preparation_native_run'] is False and q['CF_access'] is False
          assert set(r['assets_sha256']) == names - {'RELEASE.JSON','SHA256SUMS'}
          for name, sha in r['assets_sha256'].items():
              assert digest((p/name).read_bytes()) == sha
          expected = ''.join(digest((p/name).read_bytes())+'  '+name+'\n' for name in sorted(names-{'SHA256SUMS'}))
          assert (p/'SHA256SUMS').read_bytes() == expected.encode('ascii')
          PY

      - name: Create a new draft without replacing prior releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag=v0.1.0-rc.7
          test "$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)" = "$SOURCE_SHA"
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name' > existing-tags.txt
          if grep -Fxq -- "$tag" existing-tags.txt; then
            echo 'Release already exists; refusing replacement.' >&2
            exit 1
          fi
          printf '%s\n' \
            'Qualified R1 first-party components and local-media overlay; not a standalone installer.' \
            'Read START-HERE.TXT and QUALIFY.JSON. Windows media and private dependencies are excluded.' \
            'Final R1/new WHEEL.DRV qualification is emulator-only; prior physical EX panning is separate.' \
            "Exact source commit: $SOURCE_SHA" \
            "Build: https://github.com/$GH_REPO/actions/runs/${{ github.run_id }}" > release-notes.txt
          gh release create "$tag" --repo "$GH_REPO" --verify-tag --draft --prerelease --latest=false \
            --title "Windows XT $tag - qualified R1 components and overlay" \
            --notes-file release-notes.txt \
            release-r1/WINXT-REDISTRIBUTABLE-OVERLAY-R1.zip \
            release-r1/WINXT-FIRST-PARTY-R1.zip release-r1/START-HERE.TXT \
            release-r1/QUALIFY.JSON release-r1/RELEASE.JSON release-r1/SHA256SUMS
