name: Verify compact CGA choices

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify exact source checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Check compact CGA native evidence and refusal boundaries
        run: python3 -B tools/CGACMP/TEST.PY --out compact-gate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compact-cga-${{ env.SOURCE_SHA }}
          path: compact-gate/RESULT.JSN
          if-no-files-found: error
