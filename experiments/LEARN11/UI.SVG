<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 656 424" width="656" height="424"><g transform="translate(8 8)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200"><rect width="320" height="200" fill="black"/><g font-family="monospace" font-size="12"><text x="8" y="16" fill="#ffff00" textLength="112" lengthAdjust="spacingAndGlyphs">SAVE A REPORT?</text><text x="8" y="40" fill="#ffffff" textLength="136" lengthAdjust="spacingAndGlyphs">Who did you mean?</text><text x="8" y="64" fill="#ffffff" textLength="184" lengthAdjust="spacingAndGlyphs">[Choose roster name...]</text><text x="8" y="88" fill="#ffffff" textLength="288" lengthAdjust="spacingAndGlyphs">Named edition shown after selection.</text><text x="8" y="120" fill="#ffffff" textLength="248" lengthAdjust="spacingAndGlyphs">Learning was OFF for this game.</text><text x="8" y="144" fill="#ffffff" textLength="248" lengthAdjust="spacingAndGlyphs">Nothing is saved automatically.</text><rect x="8" y="174" width="88" height="22" fill="#c0c0c0" stroke="white"/><text x="12" y="189" fill="#000000" textLength="56" lengthAdjust="spacingAndGlyphs">Confirm</text><rect x="224" y="174" width="88" height="22" fill="#c0c0c0" stroke="white"/><text x="228" y="189" fill="#000000" textLength="32" lengthAdjust="spacingAndGlyphs">Skip</text></g></svg></g><g transform="translate(336 8)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200"><rect width="320" height="200" fill="black"/><g font-family="monospace" font-size="12"><text x="8" y="16" fill="#ffff00" textLength="104" lengthAdjust="spacingAndGlyphs">REVIEW REPORT</text><text x="8" y="40" fill="#ffffff" textLength="208" lengthAdjust="spacingAndGlyphs">Poseidon (Greek mythology)</text><text x="8" y="68" fill="#ffffff" textLength="144" lengthAdjust="spacingAndGlyphs">4 eligible answers</text><text x="8" y="92" fill="#ffffff" textLength="224" lengthAdjust="spacingAndGlyphs">4 become active; 0 conflicts</text><text x="8" y="116" fill="#ffffff" textLength="256" lengthAdjust="spacingAndGlyphs">Known / unknown answers ignored.</text><text x="8" y="144" fill="#ffffff" textLength="176" lengthAdjust="spacingAndGlyphs">Reports are not proof.</text><rect x="8" y="174" width="72" height="22" fill="#c0c0c0" stroke="white"/><text x="12" y="189" fill="#000000" textLength="56" lengthAdjust="spacingAndGlyphs">Details</text><rect x="88" y="174" width="128" height="22" fill="#c0c0c0" stroke="white"/><text x="92" y="189" fill="#000000" textLength="88" lengthAdjust="spacingAndGlyphs">Save report</text><rect x="232" y="174" width="80" height="22" fill="#c0c0c0" stroke="white"/><text x="236" y="189" fill="#000000" textLength="32" lengthAdjust="spacingAndGlyphs">Skip</text></g></svg></g><g transform="translate(8 216)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200"><rect width="320" height="200" fill="black"/><g font-family="monospace" font-size="12"><text x="8" y="16" fill="#ffff00" textLength="168" lengthAdjust="spacingAndGlyphs">CHANGED ANSWERS 1 / 2</text><text x="8" y="40" fill="#ffffff" textLength="272" lengthAdjust="spacingAndGlyphs">Did this version of your character</text><text x="8" y="52" fill="#ffffff" textLength="152" lengthAdjust="spacingAndGlyphs">debut in animation?</text><text x="8" y="64" fill="#ffff00" textLength="184" lengthAdjust="spacingAndGlyphs">NO; 2 reports -&gt; active</text><text x="8" y="104" fill="#ffffff" textLength="304" lengthAdjust="spacingAndGlyphs">Does your character have extraordinary</text><text x="8" y="116" fill="#ffffff" textLength="144" lengthAdjust="spacingAndGlyphs">physical strength?</text><text x="8" y="128" fill="#ffff00" textLength="192" lengthAdjust="spacingAndGlyphs">YES; 2 reports -&gt; active</text><rect x="8" y="174" width="72" height="22" fill="#c0c0c0" stroke="white"/><text x="12" y="189" fill="#000000" textLength="32" lengthAdjust="spacingAndGlyphs">Back</text><rect x="232" y="174" width="80" height="22" fill="#c0c0c0" stroke="white"/><text x="236" y="189" fill="#000000" textLength="32" lengthAdjust="spacingAndGlyphs">Next</text></g></svg></g><g transform="translate(336 216)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200"><rect width="320" height="200" fill="black"/><g font-family="monospace" font-size="12"><text x="8" y="16" fill="#ffff00" textLength="112" lengthAdjust="spacingAndGlyphs">LOCAL LEARNING</text><text x="8" y="40" fill="#ffffff" textLength="176" lengthAdjust="spacingAndGlyphs">Use learned facts: OFF</text><text x="8" y="64" fill="#ffffff" textLength="264" lengthAdjust="spacingAndGlyphs">11 active; 0 pending; 0 conflicts</text><text x="8" y="88" fill="#ffffff" textLength="224" lengthAdjust="spacingAndGlyphs">Cells 11/256; reports 42/128</text><text x="8" y="116" fill="#ffffff" textLength="216" lengthAdjust="spacingAndGlyphs">Learned games cannot teach.</text><text x="8" y="140" fill="#ffffff" textLength="216" lengthAdjust="spacingAndGlyphs">Reset keeps old report IDs.</text><rect x="8" y="174" width="80" height="22" fill="#c0c0c0" stroke="white"/><text x="12" y="189" fill="#000000" textLength="48" lengthAdjust="spacingAndGlyphs">Toggle</text><rect x="104" y="174" width="128" height="22" fill="#c0c0c0" stroke="white"/><text x="108" y="189" fill="#000000" textLength="88" lengthAdjust="spacingAndGlyphs">Reset facts</text><rect x="248" y="174" width="64" height="22" fill="#c0c0c0" stroke="white"/><text x="252" y="189" fill="#000000" textLength="40" lengthAdjust="spacingAndGlyphs">Close</text></g></svg></g></svg>